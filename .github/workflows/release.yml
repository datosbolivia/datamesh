name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.1)'
        required: true
        default: 'v0.2.1'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Go Multi-Platform Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cli_name: datamesh-linux-amd64
            shared_lib: libdatamesh.so
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cli_name: datamesh-darwin-arm64
            shared_lib: libdatamesh.dylib
          - os: windows-latest
            goos: windows
            goarch: amd64
            cli_name: datamesh-windows-amd64.exe
            shared_lib: datamesh.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core-go/go.sum

      - name: Build Static CLI Binary
        run: |
          cd core-go
          go build -ldflags="-s -w" -o "${{ matrix.cli_name }}" ./adapters/inbound/cli

      - name: Build C-Shared Library
        if: matrix.os != 'windows-latest'
        run: |
          cd core-go
          go build -buildmode=c-shared -o "${{ matrix.shared_lib }}" ./adapters/inbound/cshared/exports.go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            core-go/${{ matrix.cli_name }}
            core-go/${{ matrix.shared_lib }}
          if-no-files-found: ignore

  build-wasm:
    name: Build WebAssembly (WASM) Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Go WASM
        run: |
          cd core-go
          GOOS=js GOARCH=wasm go build -o datamesh.wasm ./adapters/inbound/wasm/main_wasm.go

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: datamesh-wasm
          path: core-go/datamesh.wasm

  build-python-wheel:
    name: Build Python Package with Native C-Shared Core
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Linux libdatamesh.so directly into Python package
        run: |
          cd core-go
          go build -buildmode=c-shared -o ../bindings/python/datamesh/libdatamesh.so ./adapters/inbound/cshared/exports.go
          ls -la ../bindings/python/datamesh/libdatamesh.so

      - name: Build Wheel & Source Distribution
        run: |
          cd bindings/python
          pip install --upgrade build
          python -m build

      - name: Upload Python Dist
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: bindings/python/dist/*

  create-release:
    name: Create GitHub Release with Checksums
    runs-on: ubuntu-latest
    needs: [build-binaries, build-wasm, build-python-wheel]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Organize release files & Compute SHA256 Checksums
        run: |
          mkdir -p release-assets
          find dist-release -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
